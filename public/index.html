<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognexia Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 28px;
      color: #667eea;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-box {
      background: #f5f5f5;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      width: 300px;
      transition: all 0.3s ease;
    }

    .search-box:focus {
      outline: none;
      border-color: #667eea;
      background: white;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #667eea;
      color: white;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 3fr 1fr;
      gap: 20px;
    }

    .sidebar {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      height: fit-content;
    }

    .sidebar-section {
      margin-bottom: 24px;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .sidebar-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
    }

    .sidebar-item:hover {
      background: #f5f5f5;
      border-left-color: #667eea;
    }

    .sidebar-item.active {
      background: #667eea;
      color: white;
      border-left-color: #667eea;
      font-weight: 600;
    }

    .main-content {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .memory-item {
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .memory-item:hover {
      border-color: #667eea;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
    }

    .memory-item.selected {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .memory-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .memory-item-type {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .memory-item-date {
      font-size: 12px;
      color: #999;
    }

    .memory-item-content {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .memory-item-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #999;
    }

    .memory-detail {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      height: fit-content;
    }

    .memory-detail-title {
      font-size: 16px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 12px;
    }

    .memory-detail-content {
      font-size: 14px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 16px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 6px;
    }

    .memory-detail-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .meta-item {
      padding: 8px;
      background: #f5f5f5;
      border-radius: 6px;
    }

    .meta-label {
      color: #999;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .meta-value {
      color: #333;
      font-weight: 500;
    }

    .memory-detail-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      flex: 1;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }

    .empty-state-text {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .empty-state-subtext {
      font-size: 14px;
      color: #bbb;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .graph-container {
      width: 100%;
      height: 400px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .node {
      stroke: #667eea;
      stroke-width: 2px;
    }

    .node text {
      font-size: 12px;
      pointer-events: none;
      fill: #333;
    }

    .link {
      stroke: #ccc;
      stroke-width: 2px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: #fee;
      border: 2px solid #f88;
      color: #c33;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .success {
      background: #efe;
      border: 2px solid #8f8;
      color: #3c3;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    textarea {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    }

    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
  <script>
    const { useState, useEffect, useRef } = React;
    const root = ReactDOM.createRoot(document.getElementById('root'));

    const api = {
      baseUrl: 'http://localhost:10000/api',

      async request(endpoint, options = {}) {
        try {
          const response = await fetch(`${this.baseUrl}${endpoint}`, {
            headers: { 'Content-Type': 'application/json', ...options.headers },
            ...options
          });
          const data = await response.json();
          return data;
        } catch (e) {
          console.error('API error:', e);
          throw e;
        }
      },

      async listProjects() {
        const data = await this.request('/projects');
        return data.data || [];
      },

      async listMemories(project, limit = 50) {
        const data = await this.request(`/memory/recent?project=${project}&limit=${limit}`);
        return (data.data && data.data.results) || [];
      },

      async searchMemories(project, query) {
        const data = await this.request(`/memory/query?project=${project}&q=${encodeURIComponent(query)}`);
        return (data.data && data.data.results) || [];
      },

      async getMemory(project, id) {
        const data = await this.request(`/memory/${id}`);
        return data.data || null;
      },

      async storeMemory(project, content, type = 'insight', importance = 5) {
        const data = await this.request(`/memory/store`, {
          method: 'POST',
          body: JSON.stringify({ project, content, type, importance, agentId: 'dashboard' })
        });
        return data.data || null;
      },

      async deleteMemory(project, id) {
        const data = await this.request(`/memory/${id}`, { method: 'DELETE' });
        return data;
      },

      async getGraph(project) {
        const data = await this.request(`/graph?project=${project}`);
        return data.data || { nodes: [], links: [] };
      }
    };

    function MemoryList({ project, memories, selectedId, onSelect, loading }) {
      if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));
      if (!memories.length) {
        return React.createElement('div', { className: 'empty-state' },
          React.createElement('div', { className: 'empty-state-icon' }, '📝'),
          React.createElement('div', { className: 'empty-state-text' }, 'No memories yet'),
          React.createElement('div', { className: 'empty-state-subtext' }, 'Create your first memory to get started')
        );
      }

      return React.createElement('div', { className: 'memory-list' },
        memories.map(memory =>
          React.createElement('div', {
            key: memory.id,
            className: `memory-item ${selectedId === memory.id ? 'selected' : ''}`,
            onClick: () => onSelect(memory.id)
          },
            React.createElement('div', { className: 'memory-item-header' },
              React.createElement('span', { className: 'memory-item-type' }, memory.content_type || 'insight'),
              React.createElement('span', { className: 'memory-item-date' }, new Date(memory.created_at).toLocaleDateString())
            ),
            React.createElement('div', { className: 'memory-item-content' }, memory.content),
            React.createElement('div', { className: 'memory-item-meta' },
              React.createElement('span', null, '⭐ ' + (memory.importance || 5)),
              React.createElement('span', null, '👤 ' + (memory.agent_id || 'default'))
            )
          )
        )
      );
    }

    function MemoryDetail({ memory, onDelete, loading }) {
      if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));
      if (!memory) {
        return React.createElement('div', { className: 'empty-state' },
          React.createElement('div', { className: 'empty-state-icon' }, '👈'),
          React.createElement('div', { className: 'empty-state-text' }, 'Select a memory to view details')
        );
      }

      return React.createElement('div', { className: 'memory-detail' },
        React.createElement('div', { className: 'memory-detail-title' }, 'Details'),
        React.createElement('div', { className: 'memory-detail-content' }, memory.content),
        React.createElement('div', { className: 'memory-detail-meta' },
          React.createElement('div', { className: 'meta-item' },
            React.createElement('div', { className: 'meta-label' }, 'Type'),
            React.createElement('div', { className: 'meta-value' }, memory.content_type || 'insight')
          ),
          React.createElement('div', { className: 'meta-item' },
            React.createElement('div', { className: 'meta-label' }, 'Importance'),
            React.createElement('div', { className: 'meta-value' }, '⭐ ' + (memory.importance || 5) + '/10')
          ),
          React.createElement('div', { className: 'meta-item' },
            React.createElement('div', { className: 'meta-label' }, 'Created'),
            React.createElement('div', { className: 'meta-value' }, new Date(memory.created_at).toLocaleDateString())
          ),
          React.createElement('div', { className: 'meta-item' },
            React.createElement('div', { className: 'meta-label' }, 'Agent'),
            React.createElement('div', { className: 'meta-value' }, memory.agent_id || 'default')
          )
        ),
        React.createElement('div', { className: 'memory-detail-actions' },
          React.createElement('button', {
            className: 'btn btn-secondary btn-small',
            onClick: () => onDelete(memory.id)
          }, '🗑️ Delete')
        )
      );
    }

    function GraphView({ project, data }) {
      const svgRef = useRef();

      useEffect(() => {
        if (!data || !data.nodes.length) return;

        const width = 800;
        const height = 400;
        const svg = d3.select(svgRef.current)
          .attr('width', width)
          .attr('height', height);

        svg.selectAll('*').remove();

        const simulation = d3.forceSimulation(data.nodes)
          .force('link', d3.forceLink(data.links).id(d => d.id).distance(50))
          .force('charge', d3.forceManyBody().strength(-300))
          .force('center', d3.forceCenter(width / 2, height / 2));

        const link = svg.selectAll('line')
          .data(data.links)
          .enter()
          .append('line')
          .attr('class', 'link');

        const node = svg.selectAll('circle')
          .data(data.nodes)
          .enter()
          .append('circle')
          .attr('class', 'node')
          .attr('r', 6)
          .call(d3.drag()
            .on('start', dragStarted)
            .on('drag', dragged)
            .on('end', dragEnded));

        const labels = svg.selectAll('text')
          .data(data.nodes)
          .enter()
          .append('text')
          .attr('x', 8)
          .attr('y', 3)
          .text(d => (d.label || d.id).slice(0, 8));

        simulation.on('tick', () => {
          link
            .attr('x1', d => d.source.x)
            .attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x)
            .attr('y2', d => d.target.y);

          node
            .attr('cx', d => d.x)
            .attr('cy', d => d.y);

          labels
            .attr('x', d => d.x)
            .attr('y', d => d.y);
        });

        function dragStarted(event, d) {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x;
          d.fy = d.y;
        }

        function dragged(event, d) {
          d.fx = event.x;
          d.fy = event.y;
        }

        function dragEnded(event, d) {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null;
          d.fy = null;
        }
      }, [data]);

      if (!data || !data.nodes.length) {
        return React.createElement('div', { className: 'empty-state' },
          React.createElement('div', { className: 'empty-state-icon' }, '🔗'),
          React.createElement('div', { className: 'empty-state-text' }, 'No relationships yet'),
          React.createElement('div', { className: 'empty-state-subtext' }, 'Create memories to build a knowledge graph')
        );
      }

      return React.createElement('div', { className: 'graph-container' },
        React.createElement('svg', { ref: svgRef })
      );
    }

    function Dashboard() {
      const [projects, setProjects] = useState([]);
      const [selectedProject, setSelectedProject] = useState('general');
      const [memories, setMemories] = useState([]);
      const [selectedMemoryId, setSelectedMemoryId] = useState(null);
      const [selectedMemory, setSelectedMemory] = useState(null);
      const [graphData, setGraphData] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [newMemoryContent, setNewMemoryContent] = useState('');
      const [activeTab, setActiveTab] = useState('browse');
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);
      const [stats, setStats] = useState({ total: 0, recent: 0 });

      useEffect(() => {
        loadProjects();
      }, []);

      useEffect(() => {
        loadMemories();
      }, [selectedProject]);

      useEffect(() => {
        if (selectedMemoryId && selectedProject) {
          loadMemoryDetail();
        }
      }, [selectedMemoryId]);

      async function loadProjects() {
        try {
          const data = await api.listProjects();
          setProjects(Array.isArray(data) ? data : []);
        } catch (e) {
          console.error('Failed to load projects:', e);
        }
      }

      async function loadMemories() {
        setLoading(true);
        try {
          const data = await api.listMemories(selectedProject);
          setMemories(Array.isArray(data) ? data : []);
          setStats({ total: data.length, recent: data.slice(0, 5).length });
          loadGraphData();
        } catch (e) {
          console.error('Failed to load memories:', e);
        } finally {
          setLoading(false);
        }
      }

      async function loadMemoryDetail() {
        setLoading(true);
        try {
          const data = await api.getMemory(selectedProject, selectedMemoryId);
          setSelectedMemory(data);
        } catch (e) {
          console.error('Failed to load memory:', e);
        } finally {
          setLoading(false);
        }
      }

      async function loadGraphData() {
        try {
          const data = await api.getGraph(selectedProject);
          setGraphData(data);
        } catch (e) {
          console.error('Failed to load graph:', e);
        }
      }

      async function handleSearch() {
        if (!searchQuery.trim()) {
          loadMemories();
          return;
        }
        setLoading(true);
        try {
          const data = await api.searchMemories(selectedProject, searchQuery);
          setMemories(Array.isArray(data) ? data : []);
        } catch (e) {
          console.error('Failed to search:', e);
        } finally {
          setLoading(false);
        }
      }

      async function handleCreateMemory() {
        if (!newMemoryContent.trim()) {
          setMessage({ type: 'error', text: 'Memory content cannot be empty' });
          return;
        }
        try {
          await api.storeMemory(selectedProject, newMemoryContent);
          setNewMemoryContent('');
          setMessage({ type: 'success', text: 'Memory created successfully' });
          loadMemories();
          setTimeout(() => setMessage(null), 3000);
        } catch (e) {
          setMessage({ type: 'error', text: 'Failed to create memory' });
        }
      }

      async function handleDeleteMemory(id) {
        if (!confirm('Delete this memory? This cannot be undone.')) return;
        try {
          await api.deleteMemory(selectedProject, id);
          setMessage({ type: 'success', text: 'Memory deleted' });
          setSelectedMemoryId(null);
          setSelectedMemory(null);
          loadMemories();
          setTimeout(() => setMessage(null), 3000);
        } catch (e) {
          setMessage({ type: 'error', text: 'Failed to delete memory' });
        }
      }

      const filteredMemories = !searchQuery.trim() ? memories : memories;

      return React.createElement('div', { className: 'container' },
        React.createElement('div', { className: 'header' },
          React.createElement('h1', null, '🧠 Cognexia Dashboard'),
          React.createElement('div', { className: 'header-actions' },
            React.createElement('input', {
              type: 'text',
              className: 'search-box',
              placeholder: 'Search memories...',
              value: searchQuery,
              onChange: (e) => setSearchQuery(e.target.value),
              onKeyPress: (e) => e.key === 'Enter' && handleSearch()
            }),
            React.createElement('button', {
              className: 'btn btn-primary',
              onClick: handleSearch
            }, '🔍 Search')
          )
        ),
        message && React.createElement('div', {
          className: message.type === 'error' ? 'error' : 'success'
        }, message.text),
        React.createElement('div', { className: 'layout' },
          React.createElement('div', { className: 'sidebar' },
            React.createElement('div', { className: 'sidebar-section' },
              React.createElement('div', { className: 'sidebar-title' }, 'Projects'),
              [selectedProject, ...projects.filter(p => p !== selectedProject)].map(proj =>
                React.createElement('div', {
                  key: proj,
                  className: `sidebar-item ${proj === selectedProject ? 'active' : ''}`,
                  onClick: () => setSelectedProject(proj)
                }, '📁 ' + proj)
              )
            ),
            React.createElement('div', { className: 'sidebar-section' },
              React.createElement('div', { className: 'sidebar-title' }, 'Views'),
              React.createElement('div', {
                className: `sidebar-item ${activeTab === 'browse' ? 'active' : ''}`,
                onClick: () => setActiveTab('browse')
              }, '📖 Browse'),
              React.createElement('div', {
                className: `sidebar-item ${activeTab === 'graph' ? 'active' : ''}`,
                onClick: () => setActiveTab('graph')
              }, '🔗 Graph'),
              React.createElement('div', {
                className: `sidebar-item ${activeTab === 'create' ? 'active' : ''}`,
                onClick: () => setActiveTab('create')
              }, '➕ Create')
            )
          ),
          React.createElement('div', { className: 'main-content' },
            activeTab === 'browse' && React.createElement(React.Fragment, null,
              React.createElement('div', { className: 'stats' },
                React.createElement('div', { className: 'stat-card' },
                  React.createElement('div', { className: 'stat-value' }, stats.total),
                  React.createElement('div', { className: 'stat-label' }, 'Total Memories')
                ),
                React.createElement('div', { className: 'stat-card' },
                  React.createElement('div', { className: 'stat-value' }, selectedProject),
                  React.createElement('div', { className: 'stat-label' }, 'Current Project')
                ),
                React.createElement('div', { className: 'stat-card' },
                  React.createElement('div', { className: 'stat-value' }, '✓'),
                  React.createElement('div', { className: 'stat-label' }, 'Status: Online')
                )
              ),
              React.createElement(MemoryList, {
                project: selectedProject,
                memories: filteredMemories,
                selectedId: selectedMemoryId,
                onSelect: setSelectedMemoryId,
                loading: loading
              })
            ),
            activeTab === 'graph' && React.createElement(GraphView, {
              project: selectedProject,
              data: graphData
            }),
            activeTab === 'create' && React.createElement('div', null,
              React.createElement('h3', { style: { marginBottom: '12px', color: '#667eea' } }, 'Create New Memory'),
              React.createElement('textarea', {
                style: {
                  width: '100%',
                  minHeight: '150px',
                  padding: '12px',
                  border: '2px solid #e0e0e0',
                  borderRadius: '6px',
                  fontFamily: 'inherit',
                  fontSize: '14px',
                  marginBottom: '12px',
                  resize: 'vertical'
                },
                placeholder: 'What do you want to remember?',
                value: newMemoryContent,
                onChange: (e) => setNewMemoryContent(e.target.value)
              }),
              React.createElement('button', {
                className: 'btn btn-primary',
                onClick: handleCreateMemory
              }, '💾 Save Memory')
            )
          ),
          React.createElement(MemoryDetail, {
            memory: selectedMemory,
            onDelete: handleDeleteMemory,
            loading: loading
          })
        )
      );
    }

    root.render(React.createElement(Dashboard));
  </script>
</body>
</html>
