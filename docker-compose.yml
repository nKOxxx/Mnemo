version: '3.8'

services:
  cognexia:
    build: .
    container_name: cognexia
    ports:
      - "10000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
    volumes:
      - cognexia_data:/root/.cognexia/data-lake
    restart: unless-stopped
    networks:
      - cognexia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  cognexia_data:
    driver: local

networks:
  cognexia-net:
    driver: bridge
